name: skillstreak

services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    depends_on:
      db:
        condition: service_healthy
    environment:
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      DATABASE_URL: ${DATABASE_URL:-postgresql://skillstreak:change-me-for-local-development@db:5432/skillstreak}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-replace-with-a-local-development-only-value}
      DJANGO_SETTINGS_MODULE: skillstreak.settings.local
    networks: [application]
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - .:/app

  db:
    image: postgres:17.7-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skillstreak}
      POSTGRES_USER: ${POSTGRES_USER:-skillstreak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-development}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks: [application]
    volumes:
      - postgres-data:/var/lib/postgresql/data

networks:
  application: {}

volumes:
  postgres-data:
