name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python quality and infrastructure harness
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install locked dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Verify lockfile is current
        run: python -m piptools compile --quiet --strip-extras --output-file /tmp/requirements.txt requirements.in && sed 's|--output-file=/tmp/requirements.txt|--output-file=requirements.txt|' /tmp/requirements.txt | diff --unified requirements.txt -
      - name: Check formatting
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Run infrastructure harness
        run: pytest tests/infrastructure
      - name: Django checks when application bootstrap exists
        if: ${{ hashFiles('manage.py') != '' }}
        run: python manage.py check --deploy
      - name: Django tests and coverage when application bootstrap exists
        if: ${{ hashFiles('manage.py') != '' }}
        run: pytest --cov --cov-branch --cov-fail-under=80 --cov-report=term-missing --cov-report=xml
      - name: Upload coverage on failure
        if: ${{ failure() && hashFiles('coverage.xml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@v4

  container:
    name: Container build and scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: skillstreak:pr
      - name: Scan image for critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: skillstreak:pr
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true
