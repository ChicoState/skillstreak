name: Release to Cloud Run

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  release:
    name: Validate, publish, and deploy
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install locked dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Validate application prerequisite
        run: |
          test -f manage.py || { echo "Release blocked: create the Django project and manage.py before releasing."; exit 1; }
          python manage.py check --deploy
          pytest --cov --cov-branch --cov-fail-under=80 --cov-report=xml
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
      - name: Build and publish immutable image
        env:
          IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}/skillstreak:${{ github.sha }}
        run: docker build --tag "$IMAGE" . && docker push "$IMAGE"
      - name: Scan published image for critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}/skillstreak:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true
      - name: Run Django migrations once
        run: gcloud run jobs execute "${{ vars.CLOUD_RUN_MIGRATION_JOB }}" --region "${{ vars.GCP_REGION }}" --wait
      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.CLOUD_RUN_SERVICE }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}/skillstreak:${{ github.sha }}
      - name: Verify deployed health endpoint
        run: curl --fail --retry 5 --retry-delay 3 "${{ steps.deploy.outputs.url }}/healthz"
